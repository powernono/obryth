[workspace]
members = ["crates/obryth-core", "crates/obryth-cli", "crates/obryth-mobile", "apps/desktop/src-tauri"]
default-members = ["crates/obryth-core", "crates/obryth-cli", "crates/obryth-mobile"]
exclude = ["vendor/prospero"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
ts-rs = { version = "12", features = ["serde-json-impl"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
overflow-checks = true
