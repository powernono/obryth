[package]
name = "obryth-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
obryth-core = { path = "../../../crates/obryth-core" }
obryth-cli = { path = "../../../crates/obryth-cli" }
tauri = { version = "=2.12.3", features = ["unstable", "tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
base64 = "0.22"
url = "2"
cookie = "0.18"

[features]
native-smoke = []
custom-protocol = ["tauri/custom-protocol"]
